<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>

        <div class="header"><h1>Calculator</h1></div>
</header>
<main class="calculator">

    <div class="display">
        <label for="screen"></label>
        <input
                type="text"
                id="screen"
                readonly
                placeholder="0"
                name="Calculator display"
        >
    </div>

    <div class="buttons">

        <!-- Row 1 -->
        <button class="btn operator" type="button">C</button>
        <button class="btn operator" type="button">+/-</button>
        <button class="btn operator" type="button">%</button>
        <button class="btn operator" type="button">/</button>

        <!-- Row 2 -->
        <button class="btn" type="button">7</button>
        <button class="btn" type="button">8</button>
        <button class="btn" type="button">9</button>
        <button class="btn operator" type="button">*</button>

        <!-- Row 3 -->
        <button class="btn" type="button">4</button>
        <button class="btn" type="button">5</button>
        <button class="btn" type="button">6</button>
        <button class="btn operator" type="button">-</button>

        <!-- Row 4 -->
        <button class="btn" type="button">1</button>
        <button class="btn" type="button">2</button>
        <button class="btn" type="button">3</button>
        <button class="btn operator" type="button">+</button>

        <!-- Row 5 -->
        <button class="btn zero" type="button">0</button>
        <button class="btn" type="button">.</button>
        <button class="btn equals" type="button">=</button>

    </div>

</main>

</body>
</html>
